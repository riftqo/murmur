<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Murmur</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230e0e10'/%3E%3Cg fill='%23fff'%3E%3Crect x='6' y='12.500' width='3.600' height='7' rx='1.800'/%3E%3Crect x='11.500' y='7.500' width='3.600' height='17' rx='1.800'/%3E%3Crect x='17' y='10.500' width='3.600' height='11' rx='1.800'/%3E%3Crect x='22.500' y='13.500' width='3.600' height='5' rx='1.800'/%3E%3C/g%3E%3C/svg%3E">
<style>
:root{
  --bg:#ededee; --panel:#ffffff; --raised:#ffffff; --text:#0e0e10; --sub:#6d6d72; --line:rgba(14,14,16,.09);
  --bubble:#f0f0f1; --bubble-text:#0e0e10; --accent:#0e0e10; --accent-2:#35353a; --on-accent:#ffffff;
  --glass:rgba(255,255,255,.86); --field:#f3f3f4; --shadow:0 40px 90px rgba(0,0,0,.14),0 2px 10px rgba(0,0,0,.05);
  --danger:var(--text); --r:20px; --r2:6px; --fs:16px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --spring:cubic-bezier(.34,1.36,.64,1); --ease:cubic-bezier(.32,.72,0,1); --grad:var(--accent);
}
:root[data-theme="dark"]{
  --bg:#000000; --panel:#111113; --raised:#3a3a3d; --text:#f4f4f5; --sub:#9a9a9f; --line:rgba(255,255,255,.11);
  --bubble:#232326; --bubble-text:#f4f4f5; --accent:#f4f4f5; --accent-2:#cfcfd3; --on-accent:#0e0e10; --glass:rgba(17,17,19,.86); --field:#1c1c1f; --shadow:0 40px 90px rgba(0,0,0,.6);
}
@media (prefers-color-scheme:dark){:root[data-theme="auto"]{
  --bg:#000000; --panel:#111113; --raised:#3a3a3d; --text:#f4f4f5; --sub:#9a9a9f; --line:rgba(255,255,255,.11);
  --bubble:#232326; --bubble-text:#f4f4f5; --accent:#f4f4f5; --accent-2:#cfcfd3; --on-accent:#0e0e10; --glass:rgba(17,17,19,.86); --field:#1c1c1f; --shadow:0 40px 90px rgba(0,0,0,.6);
}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;display:grid;place-items:center;overflow:hidden;
  background-image:radial-gradient(70vw 60vh at 0 0,color-mix(in srgb,var(--panel) 70%,transparent),transparent 70%),radial-gradient(60vw 60vh at 100% 100%,color-mix(in srgb,var(--text) 7%,transparent),transparent 70%)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.glass{background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px)}

/* ───────── App frame: one pane on phones, two on wider screens ───────── */
.app{position:relative;width:100%;height:100dvh;background:var(--panel);overflow:hidden;display:flex}
.pane{min-width:0;min-height:0;display:flex;flex-direction:column;position:relative}
#home{flex:1}#chat{flex:1}
.app[data-view="home"] #chat,.app[data-view="chat"] #home,.app[data-view="onboard"] .pane,.app:not([data-view="onboard"]) #onboard{display:none}
@media (min-width:900px){
  .app{width:min(1120px,calc(100vw - 48px));height:min(880px,calc(100dvh - 48px));border-radius:30px;box-shadow:var(--shadow);border:1px solid var(--line)}
  .app[data-view="home"] #chat,.app[data-view="chat"] #home{display:flex}
  #home{flex:none;width:360px;border-right:1px solid var(--line)}
  #back{display:none}
}
@media (min-width:600px) and (max-width:899px) and (min-height:600px){.app{width:min(560px,calc(100vw - 32px));height:calc(100dvh - 32px);border-radius:30px;box-shadow:var(--shadow);border:1px solid var(--line)}}
.app.nudged{animation:nudge .5s}

/* ───────── Shared bits ───────── */
.logo{display:inline-flex;align-items:center;gap:.32em;font-weight:700;letter-spacing:-.035em;line-height:1;color:var(--text)}.logo svg{width:.92em;height:.92em;flex:none}
.ic{display:inline-grid;place-items:center;line-height:0}.glyph{width:56px;height:56px;border-radius:50%;background:var(--field);display:grid;place-items:center;margin:0 auto 12px;color:var(--text)}
.icon{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--text);transition:background .15s,transform .15s}
.icon:hover{background:var(--line)}.icon:active{transform:scale(.92)}.icon svg{width:22px;height:22px}
.avatar{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600;line-height:1;overflow:hidden}
.avatar.emo{font-size:17px}.avatar .ic{color:inherit}
.avatar.lg{width:52px;height:52px;font-size:20px}.avatar.lg.emo{font-size:28px}
.avatar.xl{width:84px;height:84px;font-size:32px}.avatar.xl.emo{font-size:46px}
.avatar.md{width:40px;height:40px;font-size:16px}.avatar.md.emo{font-size:22px}
.pill{display:inline-flex;align-items:center;min-height:22px;padding:0 9px;border-radius:11px;font-size:11.5px;font-weight:700;letter-spacing:.02em;background:var(--field);color:var(--sub)}
.pill.owner{background:var(--text);color:var(--panel)}.pill.admin{background:none;box-shadow:inset 0 0 0 1.500px var(--text);color:var(--text)}
.pill.banned{text-decoration:line-through}
.primary{width:100%;min-height:54px;border-radius:16px;background:var(--accent);color:var(--on-accent);font-size:17px;font-weight:600;transition:transform .15s,opacity .15s}
.primary:hover{opacity:.88}.primary:active{transform:scale(.98)}.primary:disabled{opacity:.45;cursor:default;box-shadow:none}
.secondary{width:100%;min-height:50px;border-radius:16px;background:var(--field);font-size:16px;font-weight:600}
.linkish{color:var(--text);font-weight:600;font-size:inherit;text-decoration:underline;text-underline-offset:3px}
.err{color:var(--text);font-weight:600;font-size:14px;min-height:20px;margin:8px 0 0}
.input{width:100%;min-height:52px;border-radius:16px;border:1.5px solid transparent;background:var(--field);font-size:17px;padding:0 16px;outline:none;transition:border-color .15s}
.input:focus{border-color:color-mix(in srgb,var(--accent) 60%,transparent)}
.input::placeholder{color:var(--sub);opacity:.75}

/* ───────── Onboarding ───────── */
#onboard{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 24px;overflow:auto;text-align:center}
.ob{width:min(400px,100%);animation:stepIn .46s var(--ease) both}
.ob .logo{font-size:46px;margin-bottom:14px}
.ob h2{font-size:28px;line-height:1.15;letter-spacing:-.03em;font-weight:700;margin:0 0 8px}
.ob p{color:var(--sub);font-size:17px;line-height:1.45;margin:0 0 26px}
.ob .input{margin-bottom:10px;text-align:left}
.ob .at{position:relative}.ob .at span{position:absolute;left:16px;top:15px;color:var(--sub);font-size:17px}.ob .at .input{padding-left:34px}
.steps{display:flex;gap:6px;justify-content:center;margin:0 0 28px}.steps i{width:22px;height:5px;border-radius:3px;background:var(--line)}.steps i.on{background:var(--accent)}
.feature{display:flex;gap:14px;align-items:center;text-align:left;padding:10px 4px;font-size:16px}.feature .ic{width:44px;height:44px;border-radius:14px;background:var(--field);flex:none}
.feature small{display:block;color:var(--sub);font-size:14px}

/* ───────── Home ───────── */
.hbar{flex:none;display:flex;align-items:center;gap:8px;padding:calc(16px + env(safe-area-inset-top)) 14px 8px 18px}
.hbar h1{flex:1;font-size:24px;margin:0;line-height:1}.hbar h1 .logo{font-size:24px}
.round{width:38px;height:38px;border-radius:50%;background:var(--field);color:var(--text);display:grid;place-items:center;transition:transform .15s,background .15s}.round:hover{background:color-mix(in srgb,var(--text) 10%,transparent)}.round:active{transform:scale(.92)}
.plus{width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.plus svg{width:20px;height:20px}
.searchwrap{flex:none;padding:6px 14px 4px}
.searchwrap .input{min-height:42px;border-radius:14px;font-size:16px}
.filters{flex:none;display:flex;gap:6px;padding:8px 14px 6px;overflow-x:auto}
.filters button{flex:none;min-height:32px;padding:0 13px;border-radius:16px;background:var(--field);font-size:13.5px;font-weight:600;color:var(--sub)}
.filters button.on{background:var(--text);color:var(--panel)}
.notice{margin:6px 14px;padding:12px 14px;border-radius:16px;background:var(--field);font-size:13.5px;line-height:1.4}
.chatlist{flex:1;min-height:0;overflow-y:auto;padding:4px 8px calc(12px + env(safe-area-inset-bottom))}
.crow{display:flex;align-items:center;gap:12px;width:100%;padding:9px 8px;border-radius:18px;text-align:left;transition:background .12s}
.crow:hover{background:color-mix(in srgb,var(--text) 4%,transparent)}.crow.on{background:color-mix(in srgb,var(--text) 7%,transparent)}
.crow .mid{flex:1;min-width:0}
.crow b .ic{color:var(--sub)}.crow .end .ic{vertical-align:-2px}
.crow b{display:flex;align-items:center;gap:5px;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow b span{overflow:hidden;text-overflow:ellipsis}
.crow small{display:block;font-size:14px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.crow.unread small{color:var(--text);font-weight:600}
.crow .end{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:5px;font-size:12px;color:var(--sub)}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--accent);color:var(--on-accent);font-size:12px;font-weight:700;display:grid;place-items:center}
.req{display:flex;align-items:center;gap:12px;margin:4px 8px;padding:10px 12px;border-radius:18px;background:var(--field)}
.req .mid{flex:1;min-width:0;font-size:15px}.req small{display:block;color:var(--sub);font-size:13px}
.req button{min-height:34px;padding:0 14px;border-radius:17px;font-size:14px;font-weight:700}.req .yes{background:var(--accent);color:var(--on-accent)}.req .no{color:var(--sub)}
.empty{margin:auto;text-align:center;color:var(--sub);padding:28px;max-width:320px;font-size:15px;line-height:1.45}
.empty b{display:block;color:var(--text);font-size:19px;font-weight:600;margin-bottom:6px;letter-spacing:-.02em}
.empty .secondary{margin-top:10px}

/* ───────── Wallpapers ───────── */
.wall{position:absolute;inset:0;background-size:cover;background-position:center;pointer-events:none}
.w-glow{background:radial-gradient(90% 60% at 0 0,color-mix(in srgb,var(--accent) 16%,transparent),transparent 70%),radial-gradient(90% 60% at 100% 100%,color-mix(in srgb,var(--accent) 12%,transparent),transparent 70%)}
.w-mist{background:linear-gradient(180deg,color-mix(in srgb,var(--text) 9%,transparent),transparent 55%,color-mix(in srgb,var(--text) 5%,transparent))}
.w-lines{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--text) 6%,transparent) 0 1px,transparent 1px 14px)}
.w-dots{background:radial-gradient(color-mix(in srgb,var(--text) 16%,transparent) 1.200px,transparent 1.700px) 0 0/22px 22px}
.w-grid{background:linear-gradient(var(--line) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/28px 28px}
.w-stars{background:radial-gradient(1.500px 1.500px at 24px 30px,color-mix(in srgb,var(--text) 60%,transparent),transparent 100%) 0 0/170px 170px,radial-gradient(1px 1px at 110px 80px,color-mix(in srgb,var(--text) 50%,transparent),transparent 100%) 0 0/130px 130px,radial-gradient(2px 2px at 70px 140px,color-mix(in srgb,var(--text) 70%,transparent),transparent 100%) 0 0/210px 210px,linear-gradient(180deg,color-mix(in srgb,var(--text) 10%,transparent),transparent 70%)}

/* ───────── Chat ───────── */
#chat.empty>:not(.blank):not(.wall){display:none}#chat:not(.empty) .blank{display:none}
.blank{flex:1;display:grid;place-items:center}
.bar{position:absolute;inset:0 0 auto 0;z-index:5;display:flex;align-items:center;gap:2px;padding:calc(8px + env(safe-area-inset-top)) 8px 8px;border-bottom:1px solid var(--line)}
.title{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;padding:4px 8px;border-radius:14px}
.title:hover{background:var(--line)}
.title div{min-width:0}
.title b{display:block;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title small{display:block;font-size:12.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:15px}
.title small.warn{color:var(--text);font-weight:600}
.pinbar{position:absolute;left:10px;right:10px;top:calc(68px + env(safe-area-inset-top));z-index:4;display:flex;align-items:center;gap:8px;min-height:38px;padding:0 12px;border-radius:14px;border:1px solid var(--line);font-size:13.5px;text-align:left;box-shadow:0 6px 18px rgba(0,0,0,.08)}
.pinbar .ic{color:var(--sub)}.pinbar span:last-child{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list{position:relative;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:calc(76px + env(safe-area-inset-top)) 12px 12px;display:flex;flex-direction:column;font-size:var(--fs)}
.list.pinned{padding-top:calc(118px + env(safe-area-inset-top))}
#msgs{display:flex;flex-direction:column;margin-top:auto}#msgs.none{margin:auto}#typing{min-height:0}
.skel{background:linear-gradient(90deg,var(--field) 20%,color-mix(in srgb,var(--field) 45%,var(--panel)) 50%,var(--field) 80%);background-size:220% 100%;animation:shimmer 1.300s linear infinite}
.skel-row{display:flex;margin-top:8px}.skel-row.me{justify-content:flex-end}.skel-row .skel{height:38px;max-width:340px;border-radius:var(--r)}
.sep,.sys{align-self:center;font-size:12px;color:var(--sub);margin:14px 0 6px;font-weight:600;text-align:center}
.sys{font-size:13px;font-weight:500;margin:8px 0 2px;padding:4px 12px;border-radius:12px;background:color-mix(in srgb,var(--bubble) 75%,transparent)}
#chat.photo .sep,#chat.photo .who{background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);padding:2px 9px;border-radius:9px;color:var(--text)}
.sys.new{animation:rise .36s var(--ease) both}
.row{display:flex;align-items:flex-end;gap:8px;margin-top:2px;max-width:100%}
.row.first{margin-top:10px}.row.me{flex-direction:row-reverse}
.row.new{animation:msgIn .42s var(--ease) both}.row.me.new{transform-origin:100% 100%}.row.them.new{transform-origin:0 100%}
.row.new.fx-pop{animation:slam .55s var(--ease) both}.row.new.fx-shake .bubble{animation:shake .7s both}
.row .avatar{visibility:hidden}.row.last .avatar{visibility:visible}.row.me .avatar{display:none}
.stack{display:flex;flex-direction:column;align-items:flex-start;min-width:0;max-width:min(76%,480px)}
.row.me .stack{align-items:flex-end}
.who{font-size:12px;color:var(--sub);margin:0 0 3px 13px;display:flex;gap:6px;align-items:center}
.wrap{display:flex;align-items:center;gap:6px;max-width:100%}.row.me .wrap{flex-direction:row-reverse}
.bubble{position:relative;padding:.5em .82em;border-radius:var(--r);background:var(--bubble);color:var(--bubble-text);font-size:1em;line-height:1.35;white-space:pre-wrap;overflow-wrap:anywhere;min-width:0;transition:opacity .2s,transform .15s}
.row.me .bubble{background:var(--accent);color:var(--on-accent)}
:root[data-fill="soft"] .row.me .bubble{background:linear-gradient(180deg,var(--accent-2),var(--accent))}
.row.them:not(.first) .bubble{border-top-left-radius:var(--r2)}.row.them:not(.last) .bubble{border-bottom-left-radius:var(--r2)}
.row.me:not(.first) .bubble{border-top-right-radius:var(--r2)}.row.me:not(.last) .bubble{border-bottom-right-radius:var(--r2)}
.row.pending .bubble,.row.failed .bubble{opacity:.6}
.row.mentioned .bubble{box-shadow:inset 0 0 0 1.500px var(--text)}
.bubble.pressed{transform:scale(.97)}
.bubble a{color:inherit;text-decoration:underline;text-underline-offset:2px}
.bubble code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9em;background:rgba(127,127,127,.25);border-radius:5px;padding:1px 5px}
.mention{font-weight:700}
.row.jumbo .bubble{background:none!important;padding:2px 4px;font-size:2.900em;line-height:1.15}
.row.fx-whisper .bubble{font-size:.8em;font-style:italic;opacity:.8}
.row.fx-spoiler .bubble{cursor:pointer}
.row.fx-spoiler .bubble:not(.revealed) .body{filter:blur(7px);-webkit-user-select:none;user-select:none}
.row.fx-spoiler .bubble:not(.revealed)::after{content:"Tap to reveal";position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:700}
.row .bubble.card{background:var(--bubble)!important;color:var(--bubble-text)!important;padding:10px 12px;min-width:210px}
.row .bubble.media{background:none!important;padding:0;overflow:hidden;line-height:0}
.bubble.media img{display:block;max-width:min(260px,100%);height:auto;border-radius:var(--r);background:var(--bubble)}
.bubble.media{border-radius:var(--r)!important}.bubble.media img.ph{filter:blur(14px);transform:scale(1.08);transition:filter .4s ease-out,transform .4s ease-out;cursor:zoom-in}.bubble.media img.ph.loaded{filter:none;transform:none}
.bubble.media .cap{display:block;line-height:1.35;padding:.45em .82em .55em;background:var(--bubble);color:var(--bubble-text)}.row.me .bubble.media .cap{background:var(--accent);color:var(--on-accent)}
.viewer{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.86);display:grid;place-items:center;padding:20px;cursor:zoom-out;animation:fade .22s ease-out both}.viewer img{max-width:100%;max-height:100%;border-radius:14px;animation:zoomIn .32s var(--ease) both}.viewer.closing{animation:fadeOut .18s ease-in both}
.shot{display:block;max-width:100%;max-height:46vh;margin:0 auto 12px;border-radius:16px}
.drop #list{outline:2px dashed var(--sub);outline-offset:-10px}
.row .bubble.gone{background:none!important;border:1px dashed var(--line);color:var(--sub)!important;font-style:italic;font-size:.9em}
.quote{display:block;font-size:.82em;line-height:1.3;opacity:.82;border-left:2.500px solid currentColor;padding:1px 0 1px 8px;margin:2px 0 6px;max-height:2.700em;overflow:hidden}
.quote b{display:block;font-weight:700}
.poll b{display:block;margin-bottom:8px}
.opt{position:relative;display:flex;justify-content:space-between;gap:10px;width:100%;min-height:38px;align-items:center;padding:0 12px;margin-top:6px;border-radius:10px;background:color-mix(in srgb,var(--text) 7%,transparent);overflow:hidden;text-align:left;font-size:.92em}
.opt i{position:absolute;inset:0 auto 0 0;background:color-mix(in srgb,var(--accent) 28%,transparent);transition:width .35s var(--spring)}
.opt span{position:relative}.opt.mine{outline:1.500px solid var(--accent)}.opt.mine span:first-of-type{font-weight:700}
.poll small{display:block;margin-top:8px;font-size:12px;color:var(--sub)}
.doodle{display:block;width:240px;max-width:100%;height:auto;background:#fff;border-radius:10px}
.invite{display:flex;align-items:center;gap:12px}.invite div{flex:1;min-width:0}.invite b{display:block}.invite small{color:var(--sub);font-size:12.5px}
.invite button{min-height:34px;padding:0 14px;border-radius:17px;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:14px}
.more{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--sub);opacity:0;transition:opacity .15s,background .15s}
.more svg{width:18px;height:18px}.row:hover .more,.more:focus-visible{opacity:1}.more:hover{background:var(--line)}
@media (hover:none){.more{display:none}.bubble{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:3px 4px 2px}
.chip{display:inline-flex;align-items:center;gap:4px;min-height:26px;padding:0 9px;border-radius:13px;background:var(--panel);border:1px solid var(--line);font-size:13px;color:var(--sub);animation:chipIn .32s var(--spring) both}
.chip.mine{background:color-mix(in srgb,var(--accent) 12%,var(--panel));border-color:var(--accent);color:var(--text)}
.time{font-size:11px;color:var(--sub);margin:2px 8px 0;display:none}.row.show-time .time{display:block}
.meta{font-size:12px;font-weight:600;color:var(--text);margin:2px 6px 0}
.dots{display:flex;gap:4px;padding:13px 14px;border-radius:var(--r);background:var(--bubble)}

/* ───────── Popovers, sheets, toasts ───────── */
.pop{position:fixed;z-index:45;border:1px solid var(--line);border-radius:24px;box-shadow:0 14px 44px rgba(0,0,0,.16);animation:popIn .2s var(--ease) both}.pop.closing{animation:popOut .12s ease-in both;pointer-events:none}

.picker{width:min(352px,calc(100vw - 16px));height:min(400px,60vh);display:flex;flex-direction:column;border-radius:22px;overflow:hidden}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;padding:10px 16px;border-radius:999px;background:rgba(20,20,22,.92);color:#fff;font-size:14px;font-weight:600;animation:toast 2.400s var(--ease) both;max-width:calc(100vw - 32px);text-align:center}
.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(10,10,12,.3);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;animation:dimIn .3s ease-out both}
.sheet-bg.closing{animation:dimOut .22s ease-in both;pointer-events:none}.sheet-bg.closing .sheet{animation:sheetOut .2s ease-in both}
.sheet{width:min(470px,100%);max-height:calc(100dvh - 32px);overflow:auto;background:var(--panel);border-radius:28px;padding:22px 20px 18px;box-shadow:var(--shadow);animation:sheetIn .34s var(--ease) both}
@media (max-width:599px){.sheet-bg{place-items:end center;padding:0}.sheet{border-radius:28px 28px 0 0;max-height:92dvh;padding-bottom:calc(18px + env(safe-area-inset-bottom));animation:sheetUp .46s var(--ease) both}.sheet-bg.closing .sheet{animation:sheetDown .24s ease-in both}}

.ghost{background:var(--field);color:var(--text)}.solid{background:var(--accent);color:var(--on-accent)}.solid:disabled{opacity:.4}.dangerb{box-shadow:inset 0 0 0 1.500px var(--text);color:var(--text)}

.group{background:var(--field);border-radius:16px;padding:4px 12px}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:50px;font-size:16px;width:100%;text-align:left}

.seg{display:flex;background:var(--field);border-radius:12px;padding:3px;gap:2px}
.group .seg{background:color-mix(in srgb,var(--text) 8%,transparent)}
.seg button{flex:1;min-height:36px;padding:0 10px;border-radius:9px;font-size:14px;font-weight:600;white-space:nowrap}
.seg button.on{background:var(--raised);box-shadow:0 1px 4px rgba(0,0,0,.16)}
.swatches{display:flex;flex-wrap:wrap;gap:10px;padding:2px 4px}

.sw.custom{background:var(--field);position:relative}.sw.custom::before{content:"+";position:absolute;font-size:20px;color:var(--sub);pointer-events:none}.sw.mono{background:linear-gradient(135deg,#0e0e10 50%,#f4f4f5 50%)}
.chipsrow{display:flex;gap:8px;overflow-x:auto;padding:2px 4px 6px}

.tile{aspect-ratio:.82;border-radius:14px;border:1px solid var(--line);background-color:var(--panel);background-size:cover;background-position:center;display:grid;place-items:end center;padding-bottom:6px;font-size:11px;font-weight:700;color:var(--sub);overflow:hidden}
.tile.on{box-shadow:0 0 0 2.500px var(--accent)}
.switch{flex:none;width:51px;height:31px;border-radius:16px;background:color-mix(in srgb,var(--text) 18%,transparent);position:relative;transition:background .2s}

.switch[aria-checked="true"]{background:var(--accent)}.switch[aria-checked="true"]::after{background:var(--on-accent)}.switch[aria-checked="true"]::after{transform:translateX(20px)}
input[type=range]{flex:1;accent-color:var(--accent);min-width:120px}
.person{display:flex;align-items:center;gap:12px;min-height:54px;width:100%;text-align:left;border-radius:14px;padding:0 6px}
button.person:hover{background:var(--line)}
.person .mid{flex:1;min-width:0}.person b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.person small{color:var(--sub);font-size:13px}
.codebox{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:15px;letter-spacing:.04em;background:var(--field);border-radius:14px;padding:14px;text-align:center;word-break:break-all;user-select:all}
.pad{display:block;width:100%;aspect-ratio:300/220;background:#fff;border-radius:16px;border:1px solid var(--line);touch-action:none;cursor:crosshair}
.gifs{columns:3;column-gap:6px;margin-top:8px;min-height:160px}
.gifs button{display:block;width:100%;margin:0 0 6px;border-radius:12px;overflow:hidden;background:var(--field);line-height:0}
.gifs img{width:100%;height:auto;display:block;opacity:0;transition:opacity .28s ease-out}.gifs img.in{opacity:1}.gifs .skel{height:86px;border-radius:12px;margin:0 0 6px;break-inside:avoid}
.credit{font-size:11px;color:var(--sub);text-align:center;margin:8px 0 0;font-weight:600;letter-spacing:.04em}
#fx{position:fixed;inset:0;z-index:50;pointer-events:none;width:100%;height:100%}

#splash{position:fixed;inset:0;z-index:90;background:var(--bg);display:grid;place-items:center;transition:opacity .34s ease-out,visibility .34s}#splash.done{opacity:0;visibility:hidden}
#splash svg{width:44px;height:44px;color:var(--text)}#splash rect{transform-box:fill-box;transform-origin:center;animation:bar 1.100s ease-in-out infinite}#splash rect:nth-child(2){animation-delay:.14s}#splash rect:nth-child(3){animation-delay:.28s}#splash rect:nth-child(4){animation-delay:.42s}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;display:inline-block;vertical-align:-3px;animation:spin .7s linear infinite}
@keyframes bar{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{from{background-position:120% 0}to{background-position:-100% 0}}
@keyframes msgIn{from{opacity:0;transform:translateY(12px) scale(.94)}to{opacity:1;transform:none}}
@keyframes typeOut{to{opacity:0;transform:translateY(4px) scale(.9)}}
@keyframes dot{0%,55%,100%{transform:translateY(0);opacity:.32}28%{transform:translateY(-4px);opacity:.95}}
@keyframes chipIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes popOut{to{opacity:0;transform:scale(.96)}}
@keyframes fadeOut{to{opacity:0}}
@keyframes dimIn{from{background-color:transparent;-webkit-backdrop-filter:blur(0);backdrop-filter:blur(0)}}
@keyframes dimOut{to{background-color:transparent;-webkit-backdrop-filter:blur(0);backdrop-filter:blur(0)}}
@keyframes sheetIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes sheetOut{to{opacity:0;transform:translateY(8px) scale(.98)}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes sheetDown{to{transform:translateY(100%)}}
@keyframes stepIn{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes pushIn{from{opacity:.3;transform:translateX(26%)}to{opacity:1;transform:none}}
@keyframes popBack{from{opacity:.3;transform:translateX(-16%)}to{opacity:1;transform:none}}
@keyframes zoomIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes toast{0%{opacity:0;transform:translate(-50%,12px)}8%,88%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,6px)}}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
@keyframes slam{0%{opacity:0;transform:scale(2.200)}55%{opacity:1;transform:scale(.92)}100%{transform:none}}
@keyframes shake{10%,50%,90%{transform:translateX(-7px) rotate(-2deg)}30%,70%{transform:translateX(7px) rotate(2deg)}}

<script>
/* ════════════════════════════════════════════════════════════════════
   Murmur — one-file chat app.
   databaseURL: your Firebase Realtime Database address.
   giphyKey:    optional free key from developers.giphy.com for GIF search.
   ════════════════════════════════════════════════════════════════════ */
const CONFIG = { databaseURL: "https://murmur-3dbfa-default-rtdb.asia-southeast1.firebasedatabase.app", giphyKey: "" };

const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };

const root = document.documentElement;

const AVATARS = '🦊 🐼 🐸 🐙 🦄 🐝 🐧 🦖 🌵 🍄 🌙 ⭐ 🔥 🍉 🍩 🎧 🎮 🛹 ⚡ 👾 🤖 👻 🧃'.split(' ');

const COLORS = [['#ececee', '#0e0e10'], ['#d6d6da', '#0e0e10'], ['#b4b4ba', '#0e0e10'], ['#8a8a90', '#ffffff'], ['#5f5f65', '#ffffff'], ['#3a3a3f', '#ffffff'], ['#0e0e10', '#ffffff'], ['#3d4450', '#ffffff']]; // avatar tones [background, text]: light to dark

/* ───────── Start-up ───────── */

  if (!me.registered && me.handle && api.live) claimHandle(me.handle, me.pub).then(r => { if (r === 'ok') { me.registered = true; saveAccount(); renderHome(); } });
  if (pending.join) joinByCode(pending.join); else if (pending.add) openAddFriend(pending.add);
}

  const h = new URLSearchParams(location.hash.slice(1)), join = h.get('join'), add = h.get('add'); if (!me || (!join && !add)) return;
  history.replaceState(null, '', location.pathname + location.search); if (join) joinByCode(join); else openAddFriend(add);
});
